<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Situation Board</title>

  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=23eb0552a6f196cd755c88274a7feb2d&libraries=geometry"></script>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.18/dist/hls.min.js"></script>
  <script>
    // HLS.js 로드 실패 시 보조 CDN을 순차적으로 시도합니다. Chrome/Edge에서는 HLS.js가 우선입니다.
    (function ensureHlsJs() {
      if (window.Hls) return;
      const candidates = [
        'https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.18/hls.min.js',
        'https://unpkg.com/hls.js@1.5.18/dist/hls.min.js'
      ];
      let i = 0;
      function loadNext() {
        if (window.Hls || i >= candidates.length) return;
        const s = document.createElement('script');
        s.src = candidates[i++];
        s.async = false;
        s.onerror = loadNext;
        document.head.appendChild(s);
      }
      window.addEventListener('load', loadNext, { once: true });
    })();
  </script>

  <style>
    html, body { height: 100%; margin: 0; }
    #topbar{
      position: fixed; z-index: 999;
      left: 12px; top: 12px;
      display:flex; gap:8px; align-items:center;
      padding: 8px 10px;
      background: rgba(0,0,0,.55);
      color: #fff; border-radius: 10px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      font-size: 13px;
      backdrop-filter: blur(6px);
    }
    #map { width: 100%; height: 100%; }

    .btn{
      cursor:pointer; user-select:none;
      padding: 6px 10px;
      border-radius: 10px;
      background: rgba(255,255,255,.14);
    }
    .btn:hover{ background: rgba(255,255,255,.2); }

    /* 영상 오버레이 */
    .overlay-card{
      width: 360px;
      background: #0f1115;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(0,0,0,.35);
      color: #fff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    .overlay-header{
      display:flex; justify-content:space-between; align-items:center;
      padding: 10px 12px;
      background: rgba(255,255,255,.06);
      font-size: 13px;
    }
    .close{
      cursor:pointer; user-select:none;
      padding: 4px 10px;
      border-radius: 10px;
      background: rgba(255,255,255,.12);
    }
    .close:hover{ background: rgba(255,255,255,.18); }
    video{ display:block; width: 360px; height: 202px; background:#000; }
    .tail{
      width: 0; height: 0; margin: 0 auto;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-top: 12px solid #0f1115;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,.25));
    }
  </style>
</head>
<body>
  <div id="topbar">
    <div class="btn" id="reloadBtn">재로딩</div>
    <div class="btn" id="toggleEditBtn">편집모드: OFF</div>
    <div id="statusText">준비</div>
  </div>
  <div id="map"></div>

  <script type="module" src="./js/app.js"></script>
  </body>
</html>
