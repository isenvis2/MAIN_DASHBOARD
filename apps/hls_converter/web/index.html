<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Situation Board</title>

  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=23eb0552a6f196cd755c88274a7feb2d&libraries=geometry"></script>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.18/dist/hls.min.js"></script>
  <script>
    // HLS.js 로드 실패 시 보조 CDN을 순차적으로 시도합니다. Chrome/Edge에서는 HLS.js가 우선입니다.
    (function ensureHlsJs() {
      if (window.Hls) return;
      const candidates = [
        'https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.18/hls.min.js',
        'https://unpkg.com/hls.js@1.5.18/dist/hls.min.js'
      ];
      let i = 0;
      function loadNext() {
        if (window.Hls || i >= candidates.length) return;
        const s = document.createElement('script');
        s.src = candidates[i++];
        s.async = false;
        s.onerror = loadNext;
        document.head.appendChild(s);
      }
      window.addEventListener('load', loadNext, { once: true });
    })();
  </script>

  <style>
    html, body { height: 100%; margin: 0; }
    #topbar{
      position: fixed; z-index: 999;
      left: 12px; top: 12px;
      display:flex; gap:8px; align-items:center;
      padding: 8px 10px;
      background: rgba(0,0,0,.55);
      color: #fff; border-radius: 10px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      font-size: 13px;
      backdrop-filter: blur(6px);
      min-width: 620px;
      max-width: calc(100vw - 24px);
      box-sizing: border-box;
    }
    #map { width: 100%; height: 100%; }
    body.embed-mode #topbar { display:none; }

    .btn{
      cursor:pointer; user-select:none;
      padding: 6px 10px;
      border-radius: 10px;
      background: rgba(255,255,255,.14);
      border: 1px solid rgba(255,255,255,.34);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.12);
      white-space: nowrap;
      flex: 0 0 auto;
    }
    #statusText{
      min-width: 0;
      flex: 1 1 auto;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-right{
      margin-left: auto;
    }
    .btn:hover{ background: rgba(255,255,255,.2); }

    /* 영상 오버레이 */
    .overlay-card{
      width: 360px;
      background: #0f1115;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(0,0,0,.35);
      color: #fff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    .overlay-header{
      display:flex; justify-content:space-between; align-items:center;
      padding: 10px 12px;
      background: rgba(255,255,255,.06);
      font-size: 13px; gap:8px;
    }
    .overlay-title{ flex:1 1 auto; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .overlay-actions{ display:flex; align-items:center; gap:6px; flex:0 0 auto; }
    .action-btn, .close{
      cursor:pointer; user-select:none;
      padding: 4px 10px;
      border-radius: 10px;
      background: rgba(255,255,255,.82);
      border: 2px solid #000;
      color:#000;
      font-weight:800;
      box-shadow: 0 1px 0 rgba(255,255,255,.35), inset 0 0 0 1px rgba(255,255,255,.08);
    }
    .action-btn:hover, .close:hover{ background: rgba(255,255,255,.94); }
    .hls-viewer-draggable{
      cursor: move;
      border: 2px solid rgba(239,68,68,.92) !important;
      box-shadow: 0 12px 30px rgba(0,0,0,.35), 0 0 0 2px rgba(239,68,68,.22) !important;
      touch-action: none;
    }
    .hls-viewer-draggable.dragging{
      opacity: .92;
      transform: scale(1.01);
      box-shadow: 0 16px 38px rgba(0,0,0,.42), 0 0 0 3px rgba(239,68,68,.34) !important;
    }
    .hls-viewer-draggable button,
    .hls-viewer-draggable video,
    .hls-viewer-draggable .overlay-actions{
      cursor: auto;
    }
    video{ display:block; width: 360px; height: 202px; background:#000; }
    .expanded-viewer-layer{
      position:fixed; inset:0; z-index:12000; display:flex; align-items:center; justify-content:center;
      background:rgba(2,6,23,.66); backdrop-filter: blur(4px);
    }
    .expanded-viewer-layer.hidden{ display:none; }
    .expanded-viewer-panel{
      width:min(88vw, 1200px); height:min(80vh, 760px);
      background:#0f1115; border-radius:18px; overflow:hidden;
      box-shadow:0 24px 70px rgba(0,0,0,.48); display:flex; flex-direction:column; color:#fff;
      border:1px solid rgba(255,255,255,.08);
    }
    .expanded-viewer-header{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      padding:12px 16px; background:rgba(255,255,255,.06); font-size:14px;
    }
    .expanded-viewer-title{ font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .expanded-viewer-body{ flex:1 1 auto; min-height:0; background:#000; }
    .expanded-viewer-body video{ width:100%; height:100%; }
    body.dashboard-cursor-hidden,
    body.dashboard-cursor-hidden * { cursor: none !important; }
    .tail{
      width: 0; height: 0; margin: 0 auto;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-top: 12px solid #0f1115;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,.25));
    }

    /* Keep timeline/time controls, but hide fullscreen and volume UI as much as Chromium allows */
    video[controls]::-webkit-media-controls-fullscreen-button,
    video[controls]::-webkit-media-controls-volume-slider,
    video[controls]::-webkit-media-controls-mute-button,
    video[controls]::-webkit-media-controls-volume-control-container {
      display: none !important;
      -webkit-appearance: none !important;
      width: 0 !important;
      min-width: 0 !important;
      max-width: 0 !important;
      overflow: hidden !important;
    }
  </style>
</head>
<body>
  <div id="topbar">
    <div class="btn" id="reloadBtn">재로딩</div>
    <div class="btn" id="toggleEditBtn">편집모드: OFF</div>
    <div id="statusText">준비</div>
    <div class="btn btn-right" id="closeAllViewersBtn">모두 닫기</div>
  </div>
  <div id="map"></div>

  <div id="expandedViewerLayer" class="expanded-viewer-layer hidden">
    <div class="expanded-viewer-panel">
      <div class="expanded-viewer-header">
        <div id="expandedViewerTitle" class="expanded-viewer-title">확대 화면</div>
        <div class="overlay-actions">
          <button id="expandedViewerRestoreBtn" class="action-btn" type="button">원위치</button>
          <button id="expandedViewerCloseBtn" class="close" type="button">닫기</button>
        </div>
      </div>
      <div class="expanded-viewer-body">
        <video id="expandedViewerVideo" autoplay muted playsinline disablePictureInPicture controlsList="nodownload noplaybackrate noremoteplayback nofullscreen"></video>
      </div>
    </div>
  </div>

  <script>
    if (new URLSearchParams(window.location.search).get('embed') === '1') { document.body.classList.add('embed-mode'); }
    (function initCursorAutoHide(idleMs) {
      let hideTimer = null;
      const showCursor = () => {
        document.body.classList.remove('dashboard-cursor-hidden');
        if (hideTimer) clearTimeout(hideTimer);
        hideTimer = setTimeout(() => document.body.classList.add('dashboard-cursor-hidden'), idleMs);
      };
      ['mousemove','mousedown','mouseup','mouseenter','mouseleave','wheel','touchstart','touchmove','pointermove','keydown'].forEach((evt) => {
        window.addEventListener(evt, showCursor, { passive: true });
      });
      showCursor();
    })(10000);
  </script>
  <script type="module" src="./js/app.js?v=20260605-v7608-single-viewer-close-all-fix"></script>
  </body>
</html>
