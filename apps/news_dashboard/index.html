
<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>재난안전공유플랫폼 뉴스 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body { 
        font-family: 'Pretendard', sans-serif; 
        color: #e5e7eb;
        background-color: #050b1d;
        background-image: 
          radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.12) 0px, transparent 55%),
          radial-gradient(at 100% 0%, rgba(139, 92, 246, 0.10) 0px, transparent 55%),
          radial-gradient(at 100% 100%, rgba(14, 165, 233, 0.10) 0px, transparent 55%),
          radial-gradient(at 0% 100%, rgba(20, 184, 166, 0.08) 0px, transparent 55%);
        min-height: 100vh;
      }
      .glass {
        background: rgba(15, 23, 42, 0.55);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.35);
      }
      @keyframes pulse-glow {
        0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
        50% { opacity: 0.6; transform: scale(1.1); box-shadow: 0 0 8px 2px rgba(34, 197, 94, 0.4); }
      }
      .live-dot {
        animation: pulse-glow 2s infinite;
      }
      .card-transition {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react/": "https://esm.sh/react@^19.2.4/",
        "react": "https://esm.sh/react@^19.2.4",
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
      }
    }
    </script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>

</body>
</html>
